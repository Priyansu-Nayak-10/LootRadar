name: Update LootRadar data snapshots

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: snapshot-update
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch game snapshots
        run: |
          npm run fetch:epic
          npm run fetch:snapshots -- --skip-news

      - name: Fetch gaming news snapshot
        continue-on-error: true
        run: node scripts/fetchDataSnapshots.mjs --news-only

      - name: Commit snapshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/epic-free-games.json public/data/gamerpower-free-games.json public/data/cheapshark-deals.json public/data/gaming-news.json public/data/always-free-games.json
          git diff --cached --quiet && exit 0
          git commit -m "Update LootRadar data snapshots"
          git pull --rebase origin main
          git push
