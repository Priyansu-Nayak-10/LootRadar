name: Send LootRadar Telegram alerts

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets are present
        env:
          SUPABASE_URL_PRESENT: ${{ secrets.SUPABASE_URL != '' }}
          SUPABASE_SECRET_KEY_PRESENT: ${{ secrets.SUPABASE_SECRET_KEY != '' }}
          TELEGRAM_BOT_TOKEN_PRESENT: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
        run: |
          echo "SUPABASE_URL present=$SUPABASE_URL_PRESENT"
          echo "SUPABASE_SECRET_KEY present=$SUPABASE_SECRET_KEY_PRESENT"
          echo "TELEGRAM_BOT_TOKEN present=$TELEGRAM_BOT_TOKEN_PRESENT"
          test "$SUPABASE_URL_PRESENT" = "true"
          test "$SUPABASE_SECRET_KEY_PRESENT" = "true"
          test "$TELEGRAM_BOT_TOKEN_PRESENT" = "true"

      - name: Verify required Supabase tables
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          check_table() {
            name="$1"
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "apikey: $SUPABASE_SECRET_KEY" \
              -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
              "$SUPABASE_URL/rest/v1/$name?select=*&limit=1")
            echo "$name HTTP=$status"
            test "$status" = "200"
          }
          check_table notification_settings
          check_table telegram_connections
          check_table saved_games
          check_table free_game_windows
          check_table sent_alerts

      - name: Send due Telegram alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: npm run send:telegram-alerts
